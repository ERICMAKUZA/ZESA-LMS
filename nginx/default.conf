limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream django {
    server django:8000;
}

upstream nextjs {
    server nextjs:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    add_header X-Frame-Options            "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-XSS-Protection           "1; mode=block"                   always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=()"   always;

    location /media/ {
        alias /app/media/;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://django;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass         http://django;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Moodle proxy — the moodle container only exists when started with
    # --profile moodle, so this resolves the upstream at request time
    # (Docker's embedded DNS at 127.0.0.11) rather than at nginx startup.
    # A hardcoded `proxy_pass http://moodle:8080` upstream block would fail
    # nginx startup entirely whenever the profile isn't active, since
    # upstream blocks resolve at config-load time.
    resolver 127.0.0.11 valid=10s;

    location /lms/ {
        set $moodle_upstream moodle:8080;
        proxy_pass         http://$moodle_upstream;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @moodle_unavailable;
    }

    location @moodle_unavailable {
        default_type application/json;
        return 503 '{"detail":"Moodle LMS is not available. Start with: docker compose --profile moodle up"}';
    }

    location / {
        proxy_pass         http://nextjs;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
