x-django-common: &django-common
  build:
    context: ./backend
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - django_static:/app/static
    - django_media:/app/media
  networks:
    - ilmp_net
  restart: unless-stopped

services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/app/static:ro
      - django_media:/app/media:ro
    depends_on:
      - django
      - nextjs
    networks:
      - ilmp_net
    restart: unless-stopped

  django:
    <<: *django-common
    user: root
    expose:
      - "8000"
    command: >
      sh -c "chmod 777 /app/media &&
             su -s /bin/sh appuser -c '
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4'"

  celery:
    <<: *django-common
    command: celery -A config.celery worker --loglevel=info

  celery-beat:
    <<: *django-common
    command: >
      celery -A config.celery beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nextjs:
    build:
      context: ./frontend
    expose:
      - "3000"
    env_file: .env
    networks:
      - ilmp_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilmp_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilmp_net
    restart: unless-stopped

  # Moodle and its DB are optional — run with: docker compose --profile moodle up
  moodle:
    image: bitnami/moodle:4
    profiles: ["moodle"]
    expose:
      - "8080"
    env_file: .env
    environment:
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_PORT_NUMBER: "3306"
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME}
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASS}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_SITE_URL: ${MOODLE_BASE_URL}
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_moodledata:/bitnami/moodledata
    depends_on:
      moodle-db:
        condition: service_healthy
    networks:
      - ilmp_net
    restart: unless-stopped

  moodle-db:
    image: mysql:8.0
    profiles: ["moodle"]
    environment:
      MYSQL_DATABASE: ${MOODLE_DB_NAME}
      MYSQL_USER: ${MOODLE_DB_USER}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - moodle_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ilmp_net
    restart: unless-stopped

networks:
  ilmp_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  django_static:
  django_media:
  moodle_data:
  moodle_moodledata:
  moodle_mysql:
